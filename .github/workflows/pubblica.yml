# Galleria FreeLaserCut: prove e pubblicazione su Cloudflare a ogni push su main.
name: Prove e pubblicazione
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run

  pubblica:
    needs: prove
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Controllo dei segreti
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Manca il segreto CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Manca il segreto CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test ${#ADMIN} -ge 30 || { echo "::error::GALLERIA_ADMIN_TOKEN manca o è più corto di 30 caratteri"; exit 1; }
        env:
          ADMIN: ${{ secrets.GALLERIA_ADMIN_TOKEN }}
      - name: Database e spazio dei file
        run: node scripts/prepara.mjs
      - name: Schema del database
        run: npx wrangler d1 migrations apply flc-galleria --remote
      - name: Pubblicazione del servizio
        run: npx wrangler deploy
      - name: Chiave di amministrazione
        run: printf '%s' "$ADMIN" | npx wrangler secret put ADMIN_TOKEN
        env:
          ADMIN: ${{ secrets.GALLERIA_ADMIN_TOKEN }}
      - name: Licenza del modello per le immagini (una volta sola, poi non fa niente)
        run: |
          curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/ai/run/@cf/meta/llama-3.2-11b-vision-instruct" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
            -d '{"prompt":"agree"}' | head -c 300; echo
      - name: Prova dal vivo
        run: |
          for i in $(seq 1 20); do
            if curl -sf https://flc-galleria.freelasercut.workers.dev/v1/salute; then echo; exit 0; fi
            sleep 15
          done
          echo "::error::Il servizio non risponde"; exit 1
